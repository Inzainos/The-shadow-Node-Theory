name: Python CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # setup-miniconda only activates the conda env in login shells;
        # without this, later steps fall back to the system Python/pip and
        # conda-only tools (flake8) are not on PATH ("command not found").
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Conda environment
      uses: conda-incubator/setup-miniconda@v4
      with:
        python-version: 3.11
        activate-environment: snt-env
        environment-file: environment.yml
        use-mamba: true
        auto-update-conda: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pytest
        python -m pip install .
    - name: Smoke test — installed SNT package
      run: |
        cd "$RUNNER_TEMP"
        python -c "import snt; assert callable(snt.ajuste_loglog)"
    - name: Check per-series phi sensitivity conclusion
      run: |
        python reconstruction_real/code/sensibilidad_phi_por_serie.py
        python -c "import csv; from pathlib import Path; p=Path('reconstruction_real/data/sensibilidad_phi_por_serie.csv'); row=next(csv.DictReader(p.open(encoding='utf-8'))); assert float(row['p_N1_bootstrap_por_serie']) < 0.05, row"
    - name: Lint for syntax errors and undefined names (flake8)
      run: |
        # Config (select/exclude/etc.) lives in .flake8 — the single source.
        flake8 .
    - name: Compile all active modules
      run: |
        python -m compileall -q code reconstruction_real dashboard delta snt
    - name: Smoke test — ACO module (v2.4.0)
      run: |
        python reconstruction_real/code/build_aco_v29.py
    - name: Regression tests, README claims and integral audit
      run: |
        # Incluye test_claims (cifras del README vs CSV) y la re-ejecución de
        # la auditoría integral v32 contra su CSV versionado (~15 s).
        pytest reconstruction_real/tests -q
