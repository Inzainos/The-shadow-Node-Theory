name: Python CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # setup-miniconda only activates the conda env in login shells;
        # without this, later steps fall back to the system Python/pip and
        # conda-only tools (flake8) are not on PATH ("command not found").
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Conda environment
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: 3.11
        activate-environment: snt-env
        environment-file: environment.yml
        use-mamba: true
        auto-update-conda: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Lint for syntax errors and undefined names (flake8)
      run: |
        # Fail the build only on real errors; archive/ holds historical code
        flake8 . --count --select=E9,F63,F7,F82 \
          --exclude=archive,.git --show-source --statistics
    - name: Compile all active modules
      run: |
        python -m compileall -q code reconstruction_real genomic_agent dashboard
    - name: Smoke test — ACO module (v2.4.0)
      run: |
        python reconstruction_real/code/build_aco_v29.py
