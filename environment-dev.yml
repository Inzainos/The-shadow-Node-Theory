name: snt-dev-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  - networkx>=3.0
  - openpyxl>=3.1.0
  - scikit-learn>=1.3.0
  - statsmodels>=0.14.0
  - seaborn>=0.12.0
  - flake8
  - pytest
  - ruff
  - pip
  - pip:
    - -r requirements.txt
# Limpieza 2026-10-26 (pendiente 2.5): pre-commit, black, isort, mypy y tox
# se retiraron porque no tienen configuración y nada los usa (CI = flake8 +
# pytest). Si el operador quiere formateo automático, la propuesta original
# era ruff + pytest — decisión pendiente de activar ruff format (fallaría
# en ~1600 avisos E/W acumulados; requiere una sesión de limpieza previa).
